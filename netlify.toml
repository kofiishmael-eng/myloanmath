# Netlify site configuration for myloanmath.com

[build]
  publish = "."

# Security headers — applied to every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.googleapis.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://*.doubleclick.net https://*.google.com; connect-src 'self' https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Long-term caching for static assets that only change when re-uploaded
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/numberToWords.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/recentTools.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/shareState.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/finance.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Force HTTPS explicitly (required by AdSense's own site-readiness checks,
# in addition to Netlify's dashboard-level "Force HTTPS" toggle)
[[redirects]]
  from = "http://myloanmath.com/*"
  to = "https://myloanmath.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.myloanmath.com/*"
  to = "https://myloanmath.com/:splat"
  status = 301
  force = true

# Collapse the www hostname on HTTPS too. Netlify usually does this from the
# dashboard's primary-domain setting, but only the http:// variants were pinned
# here — so if www is ever served over https without that setting, the entire
# site would exist twice at two hostnames. Belt and braces.
[[redirects]]
  from = "https://www.myloanmath.com/*"
  to = "https://myloanmath.com/:splat"
  status = 301
  force = true

# Note on /index.html: it serves the same page as / and is technically a
# duplicate, but the canonical tag on index.html already points at / and Search
# Console has never reported /index.html as a crawled duplicate. A forced
# redirect here interacts with Netlify's own directory-index resolution, and the
# failure mode is a site-wide redirect loop. Not worth it for a problem that
# isn't happening — revisit only if Search Console actually reports /index.html.

# Removed tool — redirect anyone with a bookmark or old search result
[[redirects]]
  from = "/cheque-amount-in-words.html"
  to = "/currency-to-words.html"
  status = 301
  force = true

# Custom 404 page (Netlify serves this automatically for any unmatched path)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---- Embeddable calculators ------------------------------------------------
# Every other path sends X-Frame-Options SAMEORIGIN and frame-ancestors 'self',
# which blocks third-party framing entirely. Only /embed/* relaxes that, so the
# rest of the site keeps its clickjacking protection. These headers are declared
# AFTER the site-wide block so they win for this path.
#
# X-Frame-Options has no "allow any origin" value, so it is unset here and
# frame-ancestors * carries the policy — modern browsers prefer CSP anyway.
[[headers]]
  for = "/embed/*"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; frame-ancestors *"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=3600, must-revalidate"
